<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas Seguras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #111827;
            color: #E5E7EB;
        }
        .card {
            /* Efecto Glassmorphism */
            background: rgba(31, 41, 55, 0.5); /* #1F2937 con 50% de opacidad */
            backdrop-filter: blur(16px);
            border: 1px solid #374151;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }
        .input-group label {
            font-weight: 600;
        }
        .range-slider::-webkit-slider-thumb {
            background: #4B5563;
        }
        .range-slider::-moz-range-thumb {
            background: #4B5563;
        }
        .copy-btn {
            background: #10B981;
            color: #1F2937;
            font-weight: 700;
            transition: background-color 0.3s;
        }
        .copy-btn:hover {
            background: #059669;
        }
        .copy-message {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .copy-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        .strength-bar {
            height: 8px;
            border-radius: 9999px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        /* Animación para el fondo */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-start min-h-screen p-4 flex-col">

    <!-- Contenedor del fondo blur animado -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute top-[-20%] left-[10%] w-96 h-96 bg-green-500/20 rounded-full filter blur-3xl animate-blob"></div>
        <div class="absolute bottom-[-10%] right-[5%] w-96 h-96 bg-blue-500/20 rounded-full filter blur-3xl animate-blob" style="animation-delay: -3s;"></div>
    </div>

    <div class="card w-full max-w-lg p-8 rounded-xl space-y-6">
        <h1 class="text-3xl font-bold text-center flex items-center justify-center gap-2">
            🔐 Generador de Contraseñas Seguras
        </h1>
        <p class="text-center text-gray-400">
            Crea contraseñas seguras y aleatorias con un clic.
        </p>

        <div class="space-y-4">
            <!-- Longitud de la Contraseña -->
            <div class="input-group">
                <label for="length" class="block text-sm mb-1">
                    Longitud: <span id="length-display">12</span>
                </label>
                <input type="range" id="length" min="8" max="32" value="12" class="w-full h-2 rounded-lg appearance-none cursor-pointer bg-gray-600 range-slider">
            </div>

            <!-- Opciones de Caracteres -->
            <div class="grid grid-cols-2 gap-4">
                <div class="flex items-center">
                    <input type="checkbox" id="lowercase" checked class="rounded text-green-500 focus:ring-green-500 bg-gray-700 border-gray-600">
                    <label for="lowercase" class="ml-2 text-sm">Minúsculas (a-z)</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="uppercase" checked class="rounded text-green-500 focus:ring-green-500 bg-gray-700 border-gray-600">
                    <label for="uppercase" class="ml-2 text-sm">Mayúsculas (A-Z)</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="numbers" checked class="rounded text-green-500 focus:ring-green-500 bg-gray-700 border-gray-600">
                    <label for="numbers" class="ml-2 text-sm">Números (0-9)</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="symbols" checked class="rounded text-green-500 focus:ring-green-500 bg-gray-700 border-gray-600">
                    <label for="symbols" class="ml-2 text-sm">Símbolos (!@#$)</label>
                </div>
            </div>

            <!-- Salida de Contraseña -->
            <div class="mt-6 relative">
                <input type="text" id="password-output" placeholder="Pega una contraseña para analizarla"
                       class="w-full p-3 rounded-lg bg-gray-700 text-lg font-mono text-gray-200 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
                <button id="copy-btn" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-gray-600 rounded-lg hover:bg-gray-500 transition-colors" aria-label="Copiar contraseña">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-200" viewBox="0 0 20 20" fill="currentColor">
                        <title>Copiar</title>
                        <path d="M7 9a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2H9a2 2 0 01-2-2V9z" />
                        <path d="M5 3a2 2 0 00-2 2v6a2 2 0 002 2V5h8a2 2 0 00-2-2H5z" />
                    </svg>
                </button>
            </div>

            <!-- Barra de fuerza -->
            <div class="mt-4">
                <div class="flex justify-between text-xs text-gray-400 mb-1">
                    <span>Fuerza de la Contraseña</span>
                    <span id="strength-display" aria-live="polite">Débil</span>
                </div>
                <div class="w-full bg-gray-600 rounded-lg overflow-hidden">
                    <div id="strength-bar" class="strength-bar" style="width: 0%;"></div>
                </div>
            </div>
            
            <div id="copy-message" class="copy-message text-center text-xs text-gray-400 mt-2">
                ¡Contraseña copiada al portapapeles!
            </div>
        </div>

        <button id="generate-btn"
                class="w-full py-3 mt-4 rounded-xl bg-green-500 text-gray-900 font-bold text-lg hover:bg-green-600 transition-colors">
            Generar Contraseña
        </button>

        <div class="text-center mt-2">
            <a href="guia.html" class="text-sm text-gray-400 hover:text-green-400 transition-colors">
                ¿Cómo funciona? Guía y explicación
            </a>
        </div>
    </div>

    <!-- Sección de Historial -->
    <div id="history-section" class="card w-full max-w-lg p-6 rounded-xl mt-6 space-y-4" style="display: none; opacity: 0; transition: opacity 0.5s ease;">
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold">Historial</h2>
            <button id="clear-history-btn" class="text-xs text-red-400 hover:text-red-300 transition-colors">
                Limpiar Historial
            </button>
        </div>
        <ul id="history-list" class="space-y-2 max-h-48 overflow-y-auto pr-2">
            <!-- El historial se llenará con JavaScript -->
            <li class="text-center text-gray-400 text-sm">No hay contraseñas en el historial.</li>
        </ul>
    </div>


    <script src="script.js" defer></script>
</body>
</html>
